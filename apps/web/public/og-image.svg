<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Atlas Studio</title>
  <desc id="description">AI comic and manga localization workspace</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fe"/>
      <stop offset="1" stop-color="#dceaff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e40af" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1100" cy="20" r="260" fill="#60a5fa" opacity="0.13"/>
  <circle cx="80" cy="610" r="230" fill="#2563eb" opacity="0.09"/>
  <g transform="translate(90 82)">
    <rect width="94" height="94" rx="24" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="47" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="800" text-anchor="middle">AS</text>
  </g>
  <text x="90" y="265" fill="#172033" font-family="Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-3">Atlas Studio</text>
  <text x="90" y="333" fill="#2563eb" font-family="Arial, sans-serif" font-size="30" font-weight="700">AI COMIC LOCALIZATION</text>
  <text x="90" y="403" fill="#61708a" font-family="Arial, sans-serif" font-size="27">Translate, inpaint, edit, and download</text>
  <text x="90" y="443" fill="#61708a" font-family="Arial, sans-serif" font-size="27">from one focused workspace.</text>
  <g transform="translate(790 105)" filter="url(#shadow)">
    <rect width="320" height="420" rx="30" fill="#ffffff" stroke="#bfd0e6" stroke-width="2"/>
    <rect x="30" y="32" width="260" height="124" rx="18" fill="#e9f1ff"/>
    <rect x="30" y="178" width="260" height="92" rx="18" fill="#f2f6fc" stroke="#d9e4f2"/>
    <rect x="55" y="200" width="145" height="15" rx="8" fill="#8492a8"/>
    <rect x="55" y="229" width="200" height="12" rx="6" fill="#bfd0e6"/>
    <rect x="30" y="292" width="260" height="96" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="55" y="316" width="176" height="15" rx="8" fill="#172033"/>
    <rect x="55" y="347" width="212" height="12" rx="6" fill="#60a5fa"/>
  </g>
</svg>
